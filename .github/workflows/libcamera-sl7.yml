name: libcamera-sl7

# Rebuilds Arch Linux ARM's libcamera 0.7.2 with the OV02C10 camera sensor
# helper (pkgs/libcamera-sl7) and uploads the split packages as one artifact.
# publish-repo.yml picks the artifact up (see its fetch list).

on:
  push:
    paths:
      - 'pkgs/libcamera-sl7/**'
      - '.github/workflows/libcamera-sl7.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Arch Linux ARM build environment (omacom/omarchy-pkg-builder, aarch64),
  # pinned by digest, the same image as linux-sl7.
  BUILDER_IMAGE: ghcr.io/omacom/omarchy-pkg-builder@sha256:a0cedbe8fb2f15aa34217ddd8a74a5e12003dc442f16f1825ab2b9e023488a63

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Lint (trailing whitespace)
        run: |
          set -euo pipefail
          if grep -rIn '[[:space:]]$' pkgs/libcamera-sl7; then
            echo "trailing whitespace found" >&2
            exit 1
          fi

      - name: Build packages in ALARM container
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm --platform linux/arm64 --user 0 \
            -v "$PWD/pkgs/libcamera-sl7:/src:ro" \
            -v "$PWD/out:/out" \
            "$BUILDER_IMAGE" bash -euxc '
              grep -q "^DisableSandbox" /etc/pacman.conf || sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman -Syu --noconfirm --needed base-devel git
              id builder >/dev/null 2>&1 || useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              cp -r /src /home/builder/build
              chown -R builder:builder /home/builder/build
              cd /home/builder/build
              su builder -c "makepkg --printsrcinfo" > /tmp/SRCINFO.new
              diff -u .SRCINFO /tmp/SRCINFO.new
              su builder -c "PKGEXT=.pkg.tar.zst makepkg --syncdeps --noconfirm --cleanbuild"
              cp /home/builder/build/*.pkg.tar.* /out/
            '
          ls -l out

      - name: Verify the packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools
          for n in libcamera libcamera-ipa libcamera-tools gst-plugin-libcamera python-libcamera; do
            ls out/"$n"-0.7.2-4.4-aarch64.pkg.tar.zst
          done
          mkdir x && bsdtar -C x -xf out/libcamera-ipa-0.7.2-4.4-aarch64.pkg.tar.zst
          ls -l x/usr/lib/libcamera x/usr/lib/libcamera/ipa
          # every IPA module is signed
          for so in x/usr/lib/libcamera/ipa/*.so; do test -s "$so.sign"; done
          # the simple (software ISP) IPA carries the OV02C10 sensor helper
          grep -c ov02c10 x/usr/lib/libcamera/ipa/ipa_soft_simple.so
          grep -q ov02c10 x/usr/lib/libcamera/ipa/ipa_soft_simple.so
          # the simple pipeline handler skips the vd55g IR sensor (patch 0005)
          mkdir y && bsdtar -C y -xf out/libcamera-0.7.2-4.4-aarch64.pkg.tar.zst
          grep -rq 'Ignoring infrared sensor' y/usr/lib
          # the default tuning file is still shipped
          bsdtar -tf out/libcamera-0.7.2-4.4-aarch64.pkg.tar.zst | grep -E 'share/libcamera/ipa/simple/uncalibrated.yaml$'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libcamera-sl7-aarch64
          path: out/*.pkg.tar.zst
          if-no-files-found: error
