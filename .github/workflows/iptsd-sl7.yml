name: iptsd-sl7

on:
  push:
    paths:
      - 'pkgs/iptsd-sl7/**'
      - '.github/workflows/iptsd-sl7.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Arch Linux ARM build environment (omacom/omarchy-pkg-builder, aarch64),
  # pinned by digest, the same image as linux-sl7.
  BUILDER_IMAGE: ghcr.io/omacom/omarchy-pkg-builder@sha256:a0cedbe8fb2f15aa34217ddd8a74a5e12003dc442f16f1825ab2b9e023488a63

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build package in ALARM container
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm --platform linux/arm64 --user 0 \
            -v "$PWD/pkgs/iptsd-sl7:/src:ro" \
            -v "$PWD/out:/out" \
            "$BUILDER_IMAGE" bash -euxc '
              grep -q "^DisableSandbox" /etc/pacman.conf || sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman -Syu --noconfirm --needed base-devel git
              id builder >/dev/null 2>&1 || useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              cp -r /src /home/builder/build
              chown -R builder:builder /home/builder/build
              cd /home/builder/build
              su builder -c "PKGEXT=.pkg.tar.zst makepkg --syncdeps --noconfirm --cleanbuild"
              cp /home/builder/build/*.pkg.tar.* /out/
            '

      - name: Verify BTI/PAC on packaged binaries
        run: |
          set -euo pipefail
          pkg=$(ls out/*.pkg.tar.* | head -n1)
          mkdir x && tar -C x -xf "$pkg"
          # Same rule as the PKGBUILD check(): report each binary's BTI/PAC
          # note and fail only on a mixed result. ALARM's crt1.o/crtbegin*.o
          # carry no note, so a consistently absent note is expected and safe
          # (the kernel only enforces BTI on binaries marked with it).
          bti=0; n=0
          for f in x/usr/bin/iptsd x/usr/bin/iptsd-calibrate x/usr/bin/iptsd-check-device x/usr/bin/iptsd-dump; do
            n=$((n + 1))
            if readelf -n "$f" | grep -q 'AArch64 feature:.*BTI'; then
              bti=$((bti + 1)); echo "$f: BTI"
            else
              echo "$f: no BTI note"
            fi
          done
          if [ "$bti" -ne 0 ] && [ "$bti" -ne "$n" ]; then
            echo "mixed BTI across binaries ($bti/$n)" >&2; exit 1
          fi
          tar -tf "$pkg" | grep -E 'etc/iptsd.d/91-calibration|61-iptsd-sl7|iptsd@.service|50-iptsd.rules'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iptsd-sl7-aarch64
          path: out/*.pkg.tar.*
          if-no-files-found: error
