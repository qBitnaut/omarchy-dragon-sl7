name: linux-sl7

on:
  push:
    paths:
      - 'pkgs/linux-sl7/**'
      - '.github/workflows/linux-sl7.yml'
  workflow_dispatch:
    inputs:
      full:
        description: Run the full makepkg build (always on for push)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: linux-sl7-${{ github.ref }}
  cancel-in-progress: true

env:
  # Arch Linux ARM build environment (omacom/omarchy-pkg-builder, aarch64),
  # pinned by digest. Update by looking up the digest of the new tag.
  BUILDER_IMAGE: ghcr.io/omacom/omarchy-pkg-builder@sha256:a0cedbe8fb2f15aa34217ddd8a74a5e12003dc442f16f1825ab2b9e023488a63

jobs:
  fast-check:
    name: Patch queue, config and device trees
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libelf-dev libssl-dev device-tree-compiler \
            python3-venv python3-pip xz-utils cpio curl ccache shellcheck

      - name: Lint scripts
        run: shellcheck -x pkgs/linux-sl7/scripts/*.sh

      - name: Install dt-schema
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet dtschema==2026.9
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Cache kernel source downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/fc/*.xz
          key: kernel-src-${{ hashFiles('pkgs/linux-sl7/PKGBUILD') }}

      - name: Apply series, resolve config, build DTBs, dtbs_check, compile touched drivers
        env:
          SL7_COMPILE: '1'
        run: pkgs/linux-sl7/scripts/fast-check.sh "$PWD/work/fc"

  full-build:
    name: makepkg in Arch Linux ARM
    needs: fast-check
    if: github.event_name == 'push' || inputs.full
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Make room on the disposable runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # Restore and save are separate steps so a failed build still saves
      # its ccache; the next attempt then resumes instead of starting cold.
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-sl7-${{ hashFiles('pkgs/linux-sl7/PKGBUILD') }}-${{ hashFiles('pkgs/linux-sl7/config.alarm', 'pkgs/linux-sl7/config.sl7', 'pkgs/linux-sl7/patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-sl7-${{ hashFiles('pkgs/linux-sl7/PKGBUILD') }}-${{ hashFiles('pkgs/linux-sl7/config.alarm', 'pkgs/linux-sl7/config.sl7', 'pkgs/linux-sl7/patches/**') }}-
            ccache-sl7-${{ hashFiles('pkgs/linux-sl7/PKGBUILD') }}-
            ccache-sl7-

      - name: Build linux-sl7 and linux-sl7-headers
        run: |
          mkdir -p .ccache out
          docker run --rm --platform linux/arm64 --user 0 \
            -v "$PWD/pkgs/linux-sl7:/src:ro" \
            -v "$PWD/.ccache:/ccache" \
            -v "$PWD/out:/out" \
            -e CCACHE_DIR=/ccache \
            "$BUILDER_IMAGE" \
            bash /src/scripts/ci-build.sh

      - name: Save ccache (also after a failed build)
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Guard against firmware in artifacts
        run: pkgs/linux-sl7/scripts/guard-artifacts.sh out

      - name: Artifact summary
        run: |
          ls -lh out out/dtbs
          cat out/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-sl7-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 14
