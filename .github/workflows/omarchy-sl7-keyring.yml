name: omarchy-sl7-keyring

on:
  push:
    paths:
      - 'pkgs/omarchy-sl7-keyring/**'
      - '.github/workflows/omarchy-sl7-keyring.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Arch Linux ARM build environment (omacom/omarchy-pkg-builder, aarch64),
  # pinned by digest, the same image as linux-sl7.
  BUILDER_IMAGE: ghcr.io/omacom/omarchy-pkg-builder@sha256:a0cedbe8fb2f15aa34217ddd8a74a5e12003dc442f16f1825ab2b9e023488a63

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Lint (shellcheck, trailing whitespace) and key sanity
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck gnupg
          shellcheck -x -s bash -S warning pkgs/omarchy-sl7-keyring/omarchy-sl7-keyring.install
          if grep -rIn '[[:space:]]$' pkgs/omarchy-sl7-keyring; then
            echo "trailing whitespace found" >&2
            exit 1
          fi
          cd pkgs/omarchy-sl7-keyring
          if [ ! -s omarchy-sl7.gpg ] || [ ! -s omarchy-sl7-trusted ]; then
            echo "::warning title=omarchy-sl7-keyring::omarchy-sl7.gpg / omarchy-sl7-trusted are empty: the package will be an inert placeholder (no signing key yet)"
          else
            # every fingerprint in -trusted must be a key in the .gpg file
            gpg --show-keys --with-colons omarchy-sl7.gpg | awk -F: '$1 == "fpr" { print $10 }' | sort > /tmp/have
            cut -d: -f1 omarchy-sl7-trusted | sort > /tmp/want
            diff -u /tmp/want /tmp/have
          fi

      - name: Build package in ALARM container
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm --platform linux/arm64 --user 0 \
            -v "$PWD/pkgs/omarchy-sl7-keyring:/src:ro" \
            -v "$PWD/out:/out" \
            "$BUILDER_IMAGE" bash -euxc '
              grep -q "^DisableSandbox" /etc/pacman.conf || sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman -Syu --noconfirm --needed base-devel git
              id builder >/dev/null 2>&1 || useradd -m builder
              cp -r /src /home/builder/build
              chown -R builder:builder /home/builder/build
              cd /home/builder/build
              su builder -c "makepkg --printsrcinfo" > /tmp/SRCINFO.new
              diff -u .SRCINFO /tmp/SRCINFO.new
              su builder -c "PKGEXT=.pkg.tar.zst makepkg --nodeps --noconfirm --cleanbuild"
              cp /home/builder/build/*.pkg.tar.* /out/
            '

      - name: Verify package contents
        run: |
          set -euo pipefail
          pkg=$(ls out/*.pkg.tar.* | head -n1)
          tar -tf "$pkg" | sort > out/contents.txt
          cat out/contents.txt
          if [ -s pkgs/omarchy-sl7-keyring/omarchy-sl7.gpg ] && [ -s pkgs/omarchy-sl7-keyring/omarchy-sl7-trusted ]; then
            for f in omarchy-sl7.gpg omarchy-sl7-trusted omarchy-sl7-revoked; do
              grep -qx "usr/share/pacman/keyrings/$f" out/contents.txt || { echo "missing: $f" >&2; exit 1; }
            done
          else
            echo "::warning title=omarchy-sl7-keyring::placeholder build: no keyring files in the package"
          fi
          mkdir x && tar -C x -xf "$pkg"
          grep -E '^(arch|depend) = ' x/.PKGINFO

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omarchy-sl7-keyring-aarch64
          path: out/*.pkg.tar.*
          if-no-files-found: error
