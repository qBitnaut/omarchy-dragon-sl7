name: omarchy-surface-sl7

on:
  push:
    paths:
      - 'pkgs/omarchy-surface-sl7/**'
      - '.github/workflows/omarchy-surface-sl7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Lint (shellcheck, trailing whitespace, Lua syntax)
        run: |
          set -euo pipefail
          cd pkgs/omarchy-surface-sl7
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck lua5.4
          shellcheck -x -s bash \
            omarchy-surface-sl7-firmware omarchy-surface-sl7-power \
            omarchy-surface-sl7-system-sleep update-uki-dtbs \
            neutralize-surface-keyboard restart-iptsd power-event \
            sl7-firmware sl7-doctor set-boot-order surface-laptop-7.sh omarchy-surface-sl7.install \
            omarchy-sl7-repo-ensure 10-omarchy-sl7-repo
          luac5.4 -p guard-pro-audio.lua
          if grep -rIn '[[:space:]]$' . ; then
            echo "trailing whitespace found" >&2
            exit 1
          fi

      # The runner is native aarch64; Arch Linux ARM has no official Docker
      # image, so import the ALARM root filesystem tarball as one.
      - name: Bootstrap ALARM container image
        run: |
          set -euo pipefail
          base=http://os.archlinuxarm.org/os
          curl -fsSL -O "$base/ArchLinuxARM-aarch64-latest.tar.gz"
          curl -fsSL -O "$base/ArchLinuxARM-aarch64-latest.tar.gz.md5"
          md5sum -c ArchLinuxARM-aarch64-latest.tar.gz.md5
          docker import ArchLinuxARM-aarch64-latest.tar.gz alarm:latest
          rm -f ArchLinuxARM-aarch64-latest.tar.gz

      # --nodeps: omarchy, linux-sl7 and iptsd-sl7 are not in the ALARM repos
      # (they come from the Omarchy and local repos at install time). The
      # package is files only, so nothing needs them to build.
      - name: Build package in ALARM container
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm \
            -v "$PWD/pkgs/omarchy-surface-sl7:/src:ro" \
            -v "$PWD/out:/out" \
            alarm:latest bash -euxc '
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman-key --init
              pacman-key --populate archlinuxarm
              pacman -Syu --noconfirm --needed base-devel git
              useradd -m builder
              cp -r /src /home/builder/build
              chown -R builder:builder /home/builder/build
              cd /home/builder/build
              su builder -c "makepkg --printsrcinfo" > /tmp/SRCINFO.new
              diff -u .SRCINFO /tmp/SRCINFO.new
              su builder -c "makepkg --nodeps --noconfirm --cleanbuild"
              cp /home/builder/build/*.pkg.tar.* /out/
              pacman -S --noconfirm --needed namcap || true
              if command -v namcap >/dev/null; then
                namcap /home/builder/build/PKGBUILD | tee /out/namcap-pkgbuild.txt || true
                namcap /home/builder/build/*.pkg.tar.* | tee /out/namcap-package.txt || true
              fi
            '

      - name: Verify package contents (no firmware blobs)
        run: |
          set -euo pipefail
          pkg=$(ls out/*.pkg.tar.* | head -n1)
          tar -tf "$pkg" | sort > out/contents.txt
          cat out/contents.txt

          # Microsoft/Qualcomm firmware must never be in the package.
          if grep -E '(^|/)usr/lib/firmware(/|$)|\.(mbn|elf|jsn|fw)(\.zst|\.xz)?$|gen70500|qcdxkmsuc|(qcadsp|qccdsp)' out/contents.txt; then
            echo "firmware-like file in package" >&2
            exit 1
          fi
          size=$(stat -c %s "$pkg")
          if [ "$size" -gt 262144 ]; then
            echo "package is ${size} bytes; a files-only package should be tiny" >&2
            exit 1
          fi

          # The pieces every consumer relies on must be present.
          for f in \
            etc/mkinitcpio.conf.d/zz-omarchy-surface-sl7.conf \
            etc/limine-entry-tool.d/omarchy-surface-sl7.conf \
            usr/lib/initcpio/install/sl7-firmware \
            usr/share/libalpm/hooks/70-omarchy-surface-sl7-keyboard.hook \
            usr/share/libalpm/hooks/85-omarchy-surface-sl7-dtbs.hook \
            usr/lib/omarchy-surface-sl7/update-uki-dtbs \
            usr/lib/systemd/system-sleep/omarchy-surface-sl7 \
            usr/bin/omarchy-surface-sl7-firmware \
            usr/bin/sl7-mac \
            usr/bin/sl7-doctor \
            usr/bin/omarchy-sl7-repo-ensure \
            etc/pacman.d/omarchy-sl7.conf \
            etc/skel/.config/omarchy/hooks/pre-refresh-pacman.d/10-omarchy-sl7-repo \
            usr/share/libalpm/hooks/80-omarchy-sl7-repo.hook \
            usr/lib/systemd/system/omarchy-sl7-repo.service \
            usr/share/wireplumber/wireplumber.conf.d/50-omarchy-surface-sl7.conf \
            usr/lib/udev/rules.d/99-omarchy-surface-sl7-power.rules; do
            grep -qx "$f" out/contents.txt || { echo "missing: $f" >&2; exit 1; }
          done

          mkdir x && tar -C x -xf "$pkg"
          grep -q 'arch = aarch64' x/.PKGINFO
          grep -q 'group = omarchy-platform-qualcomm' x/.PKGINFO
          grep -E '^depend = ' x/.PKGINFO

      - uses: actions/upload-artifact@v4
        with:
          name: omarchy-surface-sl7-aarch64
          path: |
            out/*.pkg.tar.*
            out/namcap-*.txt
            out/contents.txt
          if-no-files-found: error
