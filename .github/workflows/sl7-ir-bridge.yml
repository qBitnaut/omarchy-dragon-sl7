name: sl7-ir-bridge

on:
  push:
    paths:
      - 'pkgs/sl7-ir-bridge/**'
      - '.github/workflows/sl7-ir-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Arch Linux ARM build environment (omacom/omarchy-pkg-builder, aarch64),
  # pinned by digest, the same image as linux-sl7.
  BUILDER_IMAGE: ghcr.io/omacom/omarchy-pkg-builder@sha256:a0cedbe8fb2f15aa34217ddd8a74a5e12003dc442f16f1825ab2b9e023488a63

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build package in ALARM container
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm --platform linux/arm64 --user 0 \
            -v "$PWD/pkgs/sl7-ir-bridge:/src:ro" \
            -v "$PWD/out:/out" \
            "$BUILDER_IMAGE" bash -euxc '
              grep -q "^DisableSandbox" /etc/pacman.conf || sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman -Syu --noconfirm --needed base-devel linux-api-headers
              id builder >/dev/null 2>&1 || useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              cp -r /src /home/builder/build
              chown -R builder:builder /home/builder/build
              cd /home/builder/build
              # --nodeps: linux-sl7 (the v4l2loopback module) is a runtime
              # dependency only, and may not be published yet.
              su builder -c "PKGEXT=.pkg.tar.zst makepkg --nodeps --noconfirm --cleanbuild"
              cp /home/builder/build/*.pkg.tar.* /out/
            '

      - name: Verify package contents
        run: |
          set -euo pipefail
          pkg=$(ls out/*.pkg.tar.* | head -n1)
          tar -tf "$pkg" | grep -E 'usr/bin/sl7-ir-bridge|sl7-ir-bridge.service|71-sl7-ir-bridge.rules|modprobe.d/sl7-ir-bridge.conf'
          mkdir x && tar -C x -xf "$pkg"
          file x/usr/bin/sl7-ir-bridge | grep -q 'ARM aarch64'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sl7-ir-bridge-aarch64
          path: out/*.pkg.tar.*
          if-no-files-found: error
