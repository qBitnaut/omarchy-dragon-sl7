name: sl7-ir-bridge

on:
  push:
    paths:
      - 'pkgs/sl7-ir-bridge/**'
      - '.github/workflows/sl7-ir-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The runner is native aarch64; Arch Linux ARM has no official Docker
      # image, so import the ALARM root filesystem tarball as one.
      - name: Bootstrap ALARM container image
        run: |
          set -euo pipefail
          base=http://os.archlinuxarm.org/os
          curl -fsSL -O "$base/ArchLinuxARM-aarch64-latest.tar.gz"
          curl -fsSL -O "$base/ArchLinuxARM-aarch64-latest.tar.gz.md5"
          md5sum -c ArchLinuxARM-aarch64-latest.tar.gz.md5
          docker import ArchLinuxARM-aarch64-latest.tar.gz alarm:latest
          rm -f ArchLinuxARM-aarch64-latest.tar.gz

      - name: Build package in ALARM container
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm \
            -v "$PWD/pkgs/sl7-ir-bridge:/src:ro" \
            -v "$PWD/out:/out" \
            alarm:latest bash -euxc '
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman-key --init
              pacman-key --populate archlinuxarm
              pacman -Syu --noconfirm --needed base-devel linux-api-headers
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              cp -r /src /home/builder/build
              chown -R builder:builder /home/builder/build
              cd /home/builder/build
              # --nodeps: linux-sl7 (the v4l2loopback module) is a runtime
              # dependency only, and may not be published yet.
              su builder -c "PKGEXT=.pkg.tar.zst makepkg --nodeps --noconfirm --cleanbuild"
              cp /home/builder/build/*.pkg.tar.* /out/
            '

      - name: Verify package contents
        run: |
          set -euo pipefail
          pkg=$(ls out/*.pkg.tar.* | head -n1)
          tar -tf "$pkg" | grep -E 'usr/bin/sl7-ir-bridge|sl7-ir-bridge.service|71-sl7-ir-bridge.rules|modprobe.d/sl7-ir-bridge.conf'
          mkdir x && tar -C x -xf "$pkg"
          file x/usr/bin/sl7-ir-bridge | grep -q 'ARM aarch64'

      - uses: actions/upload-artifact@v4
        with:
          name: sl7-ir-bridge-aarch64
          path: out/*.pkg.tar.*
          if-no-files-found: error
