name: omarchy-sl7-faceunlock

on:
  push:
    paths:
      - 'pkgs/omarchy-sl7-faceunlock/**'
      - '.github/workflows/omarchy-sl7-faceunlock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Lint and fixture tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq
          if grep -rIn '[[:space:]]$' pkgs/omarchy-sl7-faceunlock; then
            echo "trailing whitespace found" >&2
            exit 1
          fi
          cd pkgs/omarchy-sl7-faceunlock
          tests/run-tests.sh
          shellcheck -x -s bash -S warning omarchy-sl7-faceunlock.install

      # The runner is native aarch64; Arch Linux ARM has no official Docker
      # image, so import the ALARM root filesystem tarball as one.
      - name: Bootstrap ALARM container image
        run: |
          set -euo pipefail
          base=http://os.archlinuxarm.org/os
          curl -fsSL -O "$base/ArchLinuxARM-aarch64-latest.tar.gz"
          curl -fsSL -O "$base/ArchLinuxARM-aarch64-latest.tar.gz.md5"
          md5sum -c ArchLinuxARM-aarch64-latest.tar.gz.md5
          docker import ArchLinuxARM-aarch64-latest.tar.gz alarm:latest
          rm -f ArchLinuxARM-aarch64-latest.tar.gz

      - name: Build package in ALARM container
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm \
            -v "$PWD/pkgs/omarchy-sl7-faceunlock:/src:ro" \
            -v "$PWD/out:/out" \
            alarm:latest bash -euxc '
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman-key --init
              pacman-key --populate archlinuxarm
              pacman -Syu --noconfirm --needed base-devel git
              useradd -m builder
              cp -r /src /home/builder/build
              chown -R builder:builder /home/builder/build
              cd /home/builder/build
              su builder -c "makepkg --printsrcinfo" > /tmp/SRCINFO.new
              diff -u .SRCINFO /tmp/SRCINFO.new
              su builder -c "PKGEXT=.pkg.tar.zst makepkg --nodeps --noconfirm --cleanbuild"
              cp /home/builder/build/*.pkg.tar.* /out/
            '

      - name: Verify package contents
        run: |
          set -euo pipefail
          pkg=$(ls out/*.pkg.tar.* | head -n1)
          tar -tf "$pkg" | sort > out/contents.txt
          for f in usr/bin/omarchy-sl7-faceunlock usr/lib/sl7-faceunlock/root-helper usr/lib/sl7-faceunlock/lid-closed usr/lib/sl7-faceunlock/lock-patch/howdy-lock-pam.patch usr/lib/systemd/user/omarchy-sl7-faceunlock-menu.service; do
            grep -qx "$f" out/contents.txt || { echo "missing: $f" >&2; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: omarchy-sl7-faceunlock-aarch64
          path: out/*.pkg.tar.*
          if-no-files-found: error
