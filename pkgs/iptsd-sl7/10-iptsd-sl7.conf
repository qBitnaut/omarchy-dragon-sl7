# SL7: iptsd can exit while spi-hid re-initialises after resume. The stock unit
# (Restart=on-failure, RestartSec=2) would hit the default start limit
# (5 in 10 s) and stay failed. BindsTo=%i.device still stops it when the node
# goes away.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=2
