# iptsd-sl7 tuning for the Surface Laptop 7 touchpad (045E:0C77).
# Loaded after 91-calibration-045E-0C77.conf, before any local
# 93-local-calibration.conf (written by iptsd-sl7-calibrate), which wins.
#
# The click itself (BTN_LEFT) is the firmware's own pressure-threshold bit
# (0x94 frame byte 2 bit 1 / button report); iptsd has no pressure or size
# setting for it. These keys only gate it indirectly:
#  - Touchpad.DisableOnPalm drops button samples while any contact is invalid
#  - Touchpad.ButtonDebounceMs drops transitions that follow another too fast
#  - Touchpad.ButtonHoldMs / ButtonMaxMoveMm / LiftGraceMs / DragStartMm /
#    DragReleaseStillMs / DragRelatchMs (patched in, see below)
# Revert: delete this file (or override keys in 93-local-calibration.conf).

[Device]
Vendor = 0x045E
Product = 0x0C77

[Touchpad]
# Off by default. With it on, a contact that fails the size/aspect checks
# below freezes pointer output and masks the click bit.
DisableOnPalm = true
# Default 25. 30 is ProgrammerIn-wonderland's ELLX value; the hold time and
# motion gating below do the real filtering, so a long debounce is not needed.
ButtonDebounceMs = 30

# Patched in by iptsd-sl7 (not in upstream): the firmware button bit must stay
# set this long, with a contact on the pad, before BTN_LEFT is emitted.
# Release is immediate. 70 filters short spikes while keeping clicks snappy;
# motion gating (below) does the heavy lifting, so there is no need to raise it
# (120 is fine if you still see spikes; it only adds click latency).
ButtonHoldMs = 70
# Patched in by iptsd-sl7: motion gating, in mm. The press is only confirmed if
# no contact moves this far during ButtonHoldMs (a contact appearing or
# disappearing counts as motion); after a press, 2+ contacts moving this far
# (two-finger scroll) release the button and mute it until the bit clears.
# One moving finger keeps the button held (click and drag). 0 disables.
# A still two-finger click (clickfinger right click) is unaffected.
ButtonMaxMoveMm = 1.5
# Patched in by iptsd-sl7: lift grace. A valid contact that vanishes for less
# than this many ms and reappears within 5 mm of its last position is treated as
# continuous (same tracking id, no lift, no touch down), and the button gating
# does not count the dropout as a contact appearing or disappearing. Bridges
# sensor detection dropouts (ghost taps while sliding, ghost right clicks while
# scrolling). Idea from the LiftGraceMs comment in ProgrammerIn-wonderland's
# ELLX iptsd build; its own comment says a longer value (70) was too much.
# 30 ms is a few sensor frames and well below a deliberate tap-lift-tap (>100
# ms). Costs up to this much delay on a real lift. 0 disables.
LiftGraceMs = 30
# Patched in by iptsd-sl7: drag latch. The firmware click bit is a pressure
# threshold and drops out while a finger slides during a click and drag (and
# does not come back), which ended the drag early. Once a confirmed press is
# followed by one contact moving DragStartMm, firmware releases are ignored
# until that contact lifts (after LiftGraceMs), or until the bit is released
# and the contacts stay still (< 0.5 mm) for DragReleaseStillMs. A re-press
# continues the drag. Clicks without movement still release at once. Two
# moving contacts (scroll) never latch. DragStartMm = 0 disables the latch;
# DragReleaseStillMs = 0 never releases because of stillness, only on lift.
# With DragRelatchMs > 0 a drag that stayed still this long is parked, not
# released: it ends only after a further DragRelatchMs of stillness, or when the
# finger lifts and does not come back in that time.
# While the physical click (firmware bit) is held, a lifted drag finger never
# ends the drag: it carries on with the next contact and ends when the bit is
# released.
DragStartMm = 1.5
DragReleaseStillMs = 300
# Patched in by iptsd-sl7: the latch follows the drag over contact re-indexing
# at speed (nearest contact to the last drag position), ignores unstable and
# briefly invalid frames, and a second mover only counts after 60 ms. After a
# real drag's finger lifts (the pad edge) with no other contact left, the
# button stays held for this long: one new contact landing in that time carries
# on the same drag, two contacts (scroll) or nothing release it. Trade-off: the
# drop after a drag that ends by lifting is delayed by this much. A click, or a
# drag that never moved DragStartMm, releases at once. 0 = off.
DragRelatchMs = 400
# Patched in by iptsd-sl7: logs every drag latch transition (latch, park, wait,
# resume, release, with timestamp and reason) to the journal. Off by default;
# set DragDebug = true in a local file (94-local.conf), or run iptsd with the
# environment variable IPTSD_SL7_DRAG_DEBUG=1.
# DragDebug = false
# Patched in by iptsd-sl7: haptic feedback strength and click force, the two
# touchpad settings Windows sends to the pad (Settings > Touchpad). Both are
# sent to the device when iptsd starts and again after every multitouch
# re-enable. Left commented out, nothing is sent and the firmware keeps its own
# setting; the values below are the Windows defaults. To change them put the
# keys in /etc/iptsd.d/94-local.conf (a [Device] section with Vendor = 0x045E
# and Product = 0x0C77 plus [Touchpad]) instead of editing this file.
# HapticIntensity: 0 to 100 (0 = no haptic feedback), Windows default 50.
# ClickForce: low, medium or high (how hard the pad has to be pressed).
# HapticIntensity = 50
# ClickForce = medium

[Contacts]
# Limits from ProgrammerIn-wonderland's ELLX calibration (ELLX 91 file, 15 in
# unit): tighter than 91's 6.2 / 5.6 (nothing was ever invalid, palm rejection
# was effectively off). Replaces our earlier 4.0 / 4.0 caps.
SizeMin = 0.7
SizeMax = 3.3
AspectMin = 1.0
AspectMax = 3.7
# Peak suppression (upstream iptsd v3.1.0, PR #205, from the Surface Laptop
# Studio 2 preset): darkens the pixels around a peak so close fingers split
# instead of merging into one big blob, with the neutral value taken as the
# heatmap average + 10 rather than the mode.
Neutral = average
NeutralValue = 10
PeakSuppressionRadius = 2
PeakSuppressionFactor = 0.25
# Hysteresis gap widened from 4 to 6 (default 24/20): a decelerating finger
# lifting off the glass no longer flickers the blob in and out.
ActivationThreshold = 28
DeactivationThreshold = 22
# Default 2 cm/frame. Moves beyond 1 cm in one frame are held back as unstable
# instead of reaching libinput as a jump.
PositionThresholdMax = 1.0
