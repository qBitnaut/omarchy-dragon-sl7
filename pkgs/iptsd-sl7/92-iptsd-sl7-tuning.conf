# iptsd-sl7 tuning for the Surface Laptop 7 touchpad (045E:0C77).
# Loaded after 91-calibration-045E-0C77.conf, before any local
# 93-local-calibration.conf (written by iptsd-sl7-calibrate), which wins.
#
# The click itself (BTN_LEFT) is the firmware's own pressure-threshold bit
# (0x94 frame byte 2 bit 1 / button report); iptsd has no pressure, size or
# hold-time setting for it. These keys only gate it indirectly:
#  - Touchpad.DisableOnPalm drops button samples while any contact is invalid
#  - Touchpad.ButtonDebounceMs drops transitions that follow another too fast
# Revert: delete this file (or override keys in 93-local-calibration.conf).

[Device]
Vendor = 0x045E
Product = 0x0C77

[Touchpad]
# Off by default. With it on, a contact that fails the size/aspect checks
# below freezes pointer output and masks the click bit.
DisableOnPalm = true
# Default 25. Long enough to swallow bounce, short of a deliberate quick tap
# (a real press is >100 ms).
ButtonDebounceMs = 60

[Contacts]
# 91 allows up to 6.2 cm / aspect 5.6 (default 2.0 / 2.5), so nothing was ever
# invalid and palm rejection was effectively off. Still above a fingertip.
SizeMax = 4.0
AspectMax = 4.0
# Hysteresis gap widened from 4 to 6 (default 24/20): a decelerating finger
# lifting off the glass no longer flickers the blob in and out.
ActivationThreshold = 28
DeactivationThreshold = 22
# Default 2 cm/frame. Moves beyond 1 cm in one frame are held back as unstable
# instead of reaching libinput as a jump.
PositionThresholdMax = 1.0
