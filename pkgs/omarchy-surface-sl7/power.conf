# /etc/omarchy-surface-sl7/power.conf
#
# Policy for omarchy-sl7-powermode (shell syntax, read by root and by the
# user's Hyprland watcher). Values shown are the defaults. An empty value
# means "do not touch that knob". Edit, then run:
#   sudo omarchy-sl7-powermode auto
#   omarchy-sl7-powermode auto        (display part, as your user)

# Master switch for automatic switching on plug/unplug and at boot.
# "omarchy-sl7-powermode battery|ac" still works when it is "no".
ENABLE=yes

# Battery: cap every cpufreq policy's scaling_max_freq, in kHz. The Dell
# XPS 13 owners on the same SoC use 2188800. On AC every policy returns to
# cpuinfo_max_freq. Empty: leave CPU frequency alone.
CPU_MAX_FREQ_BATTERY=2188800

# Battery: cap the GPU devfreq max_freq, in Hz. "auto" picks the middle
# entry of available_frequencies (conservative). On AC the highest entry is
# restored. Empty: leave the GPU alone.
GPU_MAX_FREQ_BATTERY=auto

# Battery: Wi-Fi power save on (iw set power_save); AC: off. Set "no" to
# leave Wi-Fi alone. NetworkManager re-applies its own setting when a
# connection is re-activated; "omarchy-surface-sl7-power wifi-powersave
# enable" tells NetworkManager to stop doing that.
WIFI_PS=yes

# Surface platform profile (/sys/firmware/acpi/platform_profile or
# /sys/class/platform-profile/*), applied only if it exists and lists the
# value. The linux-sl7 kernel does not build the Surface driver yet, so this
# is normally a no-op. Set both empty if power-profiles-daemon gains a real
# platform backend and should own the profile.
PLATFORM_PROFILE_BATTERY=low-power
PLATFORM_PROFILE_AC=balanced

# Hyprland (user part, applied with hyprctl eval, never written to
# monitors.lua). Refresh rate in Hz on battery; the panel's original
# refresh rate is restored on AC. Empty: leave the refresh rate alone.
# Off by default: on the SL7 a rate change is a full modeset, so the panel
# blanks for a few seconds on every plug/unplug. Set 60 to opt in (~0.3 W).
REFRESH_ON_BATTERY=
EDP_OUTPUT=eDP-1

# Turn Hyprland animations / blur off on battery (restored on AC).
DISABLE_ANIMATIONS_ON_BATTERY=no
DISABLE_BLUR_ON_BATTERY=no

# Variable refresh (24-120 Hz), on by default. When the kernel runs with
# msm.vrr_enabled=1 (the default command line, see the limine drop-in
# /etc/limine-entry-tool.d/omarchy-surface-sl7.conf), the user service sets
# Hyprland misc.vrr to this value at runtime: 1 always, 2 fullscreen only
# (2 modesets on every fullscreen toggle). Empty or 0: leave Hyprland's
# misc.vrr alone. Has no effect without msm.vrr_enabled=1 on the cmdline.
HYPRLAND_VRR=1

# EXPERIMENTAL, opt-in: on battery, confine user.slice and system.slice to the
# CPUs of cluster 0 (systemd AllowedCPUs, runtime only; the cluster layout is
# read from sysfs) so the other two clusters can stay in their deepest idle
# state. On AC, or when this is "no", all CPUs are restored. Gain: about 0 at
# idle, up to ~0.3 W under bursty light load. Risk: latency under bursts, since
# all work shares 4 cores. See "sl7-park status" and the README.
PARK_ON_BATTERY=no
