# leds_qcom_flash stays unloaded (Surface Laptop 7), installed by omarchy-surface-sl7.
#
# leds-qcom-flash drives the PM8550 flash LEDs, which on the SL7 include the IR
# illuminator (DT: ir:flash-14 and ir:flash-23; linux-sl7 patches 0080, 0081,
# 0091-0093, 0095, 0096). That PMIC path proved to have no load (open circuit)
# and is retired: the IR emitter is lit by the vd55g sensor's GPIO 1 strobe
# through sl7-ir-bridge, on the normal boot. The IR LEDs must therefore never
# bind. This rule exits 0 without loading the module (the idiom for "install
# MODULE /bin/true"), exactly what every normal boot did before; nothing binds.
# A load that bypasses it (insmod, modprobe --ignore-install) leaves the driver's
# ir_test parameter at 0, and the driver refuses to bind the IR LED nodes by itself.
# The SL7 has no other use of this driver.
#
# Single line, plain sh: it must also work in an initramfs.
install leds_qcom_flash /bin/true

# The IR sensor driver, vd55g, has no gate (linux-sl7 7.2.8-22, patch 0098): its
# module parameter illuminator defaults to 1, so the strobe on sensor GPIO 1 and
# the led_mode control exist on every boot, and the driver holds exposure and frame
# length to what Windows Hello programs (100 lines / 1750 lines) whenever led_mode is
# on. The sl7-ir-bridge switches it on per camera session (IR_EMITTER in
# /etc/sl7-ir-bridge.conf). To disable the strobe entirely, add
# "options vd55g illuminator=0" in /etc/modprobe.d/.
