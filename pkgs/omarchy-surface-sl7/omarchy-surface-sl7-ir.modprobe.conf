# IR emitter load gate (Surface Laptop 7), installed by omarchy-surface-sl7.
#
# leds-qcom-flash drives the PM8550 flash LEDs, which on the SL7 include the IR
# illuminator (DT: ir:flash-1..4 up to linux-sl7 7.2.8-18, ir:flash-14 from
# 7.2.8-19; patches 0080, 0081, 0091, 0092). The driver
# may load only on the "linux-sl7 (IR test)" boot entry, whose kernel command
# line carries sl7.ir_test=1 (omarchy-sl7-test-entry enable ir-test).
#
# Every other boot: this rule exits 0 without loading the module, the idiom for
# "install MODULE /bin/true", so udev's alias load is quiet and nothing binds.
# On the IR test entry it loads the module with ir_test=1, the module parameter
# without which the driver refuses to bind to the IR LED nodes. A load that
# bypasses this rule (insmod, modprobe --ignore-install) leaves ir_test=0 and
# the driver refuses by itself.
#
# Single line, plain sh: it must also work in an initramfs.
install leds_qcom_flash if grep -qE '(^| )sl7[.]ir_test=1( |$)' /proc/cmdline; then exec /usr/bin/modprobe --ignore-install leds_qcom_flash ir_test=1; else echo 'leds_qcom_flash: not loaded (not the IR test boot entry: no sl7.ir_test=1)' >&2; exit 0; fi

# The IR sensor driver, vd55g, has no gate any more (linux-sl7 7.2.8-22, patch 0098):
# its module parameter illuminator defaults to 1, so the strobe on sensor GPIO 1 and
# the led_mode control exist on every boot, and the driver holds exposure and frame
# length to what Windows Hello programs (100 lines / 1750 lines) whenever led_mode is
# on. The sl7-ir-bridge switches it on per camera session (IR_EMITTER in
# /etc/sl7-ir-bridge.conf). To disable the strobe entirely, add
# "options vd55g illuminator=0" in /etc/modprobe.d/. The PMIC flash driver above stays
# on the IR test entry: the strobe does not use the PMIC.
