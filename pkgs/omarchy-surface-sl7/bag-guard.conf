# /etc/omarchy-surface-sl7/bag-guard.conf
#
# Policy for omarchy-sl7-bag-guard (shell syntax, read as root, re-read on every
# poll: no restart needed). Values shown are the defaults.
#
# The guard acts only while the lid is closed AND no power source is online AND
# no external display is connected. Docked or clamshell use is never touched.
# See: omarchy-sl7-bag-guard --check     journalctl -t omarchy-sl7-bag-guard

# 1: active. 0: the service keeps running but does nothing.
ENABLED=1

# Seconds awake with the lid closed on battery before "systemctl suspend"
# (logind normally suspends at once; this is the backstop).
AWAKE_GRACE_S=120

# Consecutive suspend attempts that did not complete before ACTION_ON_FAIL.
# Attempts are AWAKE_GRACE_S apart.
MAX_SUSPEND_FAILS=3

# poweroff: power off cleanly after MAX_SUSPEND_FAILS (there is no hibernation)
# and when the temperature limit below is exceeded.
# suspend-only: never power off; a hot machine is suspended instead.
ACTION_ON_FAIL=poweroff

# Thermal: any thermal zone above this many degrees Celsius for TEMP_GRACE_S
# seconds, lid closed on battery, is ACTION_ON_FAIL. 0 turns the check off.
TEMP_LIMIT_C=60
TEMP_GRACE_S=60

# Seconds between checks (minimum 5). The guard sleeps in between.
POLL_S=15

# Thermal zones whose type matches this extended regex (lower case) are ignored,
# as are readings outside 1-150 C. See the zones line of --check.
THERMAL_EXCLUDE='batt|bms|charg|usb'
