# Surface Laptop 7 (Snapdragon X, romulus13/romulus15) initramfs additions.
# Installed by omarchy-surface-sl7. The zz- prefix sorts after Omarchy's
# omarchy_hooks.conf and after the surface_device_modules.conf that Omarchy's
# fix-surface-keyboard.sh writes, so the += below extends whatever list those
# built and the filter further down removes the x86-only entries.

# Built-in keyboard (Surface Aggregator Module over SAM/UART), display
# (msm + clocks + eDP PHY + panel), USB-C DP alt mode, qrtr, I2C HID.
# Every entry is optional ("?"): mkinitcpio skips a module that does not exist,
# so the stock linux-aarch64 rescue UKI (no SURFACE_* modules) still builds.
# All names were verified to exist as modules in linux-sl7 7.2.8-1.
# ath12k is deliberately NOT here: it probes before its firmware is reachable
# in the initramfs and does not retry (recon runs 4/5); it loads after
# switch_root.
MODULES+=(
  surface_aggregator? surface_aggregator_registry? surface_aggregator_hub?
  surface_hid_core? surface_hid?
  msm? dispcc-x1e80100? gpucc-x1e80100? phy-qcom-edp? panel-edp?
  ps883x? pmic_glink? pmic_glink_altmode? ucsi_glink?
  qrtr? i2c-hid-of? leds_qcom_lpg?
)

# Omarchy's fix-surface-keyboard.sh fires here (the LPASS pinctrl modules
# are loaded; recon run 5) and writes
#   MODULES=(<pinctrl_*> surface_* surface_kbd intel_lpss_pci 8250_dw)
# surface_kbd and intel_lpss_pci do not exist on arm64, 8250_dw is not built
# in linux-sl7, and pinctrl_* are not needed early. Drop them whatever file
# they came from, and drop duplicates ("name" and "name?" count as the same).
_sl7_modules=()
_sl7_names=()
for _sl7_m in "${MODULES[@]}"; do
  _sl7_n=${_sl7_m%\?}
  case $_sl7_n in
    surface_kbd | intel_lpss_pci | 8250_dw | pinctrl_*) continue ;;
  esac
  for _sl7_seen in "${_sl7_names[@]}"; do
    [[ $_sl7_seen == "$_sl7_n" ]] && continue 2
  done
  _sl7_names+=("$_sl7_n")
  _sl7_modules+=("$_sl7_m")
done
MODULES=("${_sl7_modules[@]}")
unset _sl7_modules _sl7_names _sl7_m _sl7_n _sl7_seen

# GPU zap shader and gen70500 firmware. A plain FILES+= entry makes
# mkinitcpio error out when a file is absent or only present compressed
# (.zst/.xz), so use a hook that adds whichever variants exist.
HOOKS+=(sl7-firmware)
