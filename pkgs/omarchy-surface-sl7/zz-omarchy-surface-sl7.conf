# Surface Laptop 7 (Snapdragon X, romulus13/romulus15) initramfs additions.
# Installed by omarchy-surface-sl7. The zz- prefix sorts after Omarchy's
# omarchy_hooks.conf and after the surface_device_modules.conf that Omarchy's
# fix-surface-keyboard.sh writes, so the += below extends whatever list those
# built and the filter further down removes the x86-only entries.

# Built-in keyboard (Surface Aggregator Module over SAM/UART), display
# (msm + clocks + eDP PHY + panel), USB-C DP alt mode, qrtr, and I2C HID.
# Every name below was verified to exist as a module in linux-sl7 7.2.8-1.
MODULES+=(
  surface_aggregator surface_aggregator_registry surface_aggregator_hub
  surface_hid_core surface_hid
  msm dispcc-x1e80100 gpucc-x1e80100 phy-qcom-edp panel-edp
  ps883x pmic_glink pmic_glink_altmode ucsi_glink
  qrtr i2c-hid-of
)

# Omarchy's fix-surface-keyboard.sh writes
#   MODULES=(<pinctrl_*> surface_* surface_kbd intel_lpss_pci 8250_dw)
# for x86 Surface laptops. surface_kbd and intel_lpss_pci do not exist on
# arm64 and 8250_dw is not built in linux-sl7; mkinitcpio fails on missing
# modules. Drop them whatever file they came from, and drop duplicates.
_sl7_modules=()
for _sl7_m in "${MODULES[@]}"; do
  case $_sl7_m in
    surface_kbd | intel_lpss_pci | 8250_dw) continue ;;
  esac
  for _sl7_seen in "${_sl7_modules[@]}"; do
    [[ $_sl7_seen == "$_sl7_m" ]] && continue 2
  done
  _sl7_modules+=("$_sl7_m")
done
MODULES=("${_sl7_modules[@]}")
unset _sl7_modules _sl7_m _sl7_seen

# GPU zap shader and gen70500 firmware. A plain FILES+= entry makes
# mkinitcpio error out when a file is absent or only present compressed
# (.zst/.xz), so use a hook that adds whichever variants exist.
HOOKS+=(sl7-firmware)
