# Surface Laptop 7 speaker safety: keep the PipeWire "Pro Audio" profile off
# the X1E80100-Romulus sound card. Pro Audio bypasses the UCM mixer setup;
# a user selecting it on a pre-7.1 kernel permanently killed the right
# speakers (linux-surface#1590). WirePlumber never auto-selects pro-audio, but
# a stored or clicked selection is honoured, so this script overrides both.
wireplumber.components = [
  {
    name = omarchy-surface-sl7/guard-pro-audio.lua, type = script/lua
    provides = custom.omarchy-surface-sl7-guard-pro-audio
  }
]

wireplumber.profiles = {
  main = {
    custom.omarchy-surface-sl7-guard-pro-audio = required
  }
}
