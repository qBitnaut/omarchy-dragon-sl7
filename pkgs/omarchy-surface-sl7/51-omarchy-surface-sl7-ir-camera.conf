# Surface Laptop 7: keep the infrared camera out of PipeWire.
#
# The IR camera (ST VD55G0 on its own CSIPHY/CSID path) belongs to
# sl7-ir-bridge, which streams it on demand into a v4l2loopback node for face
# unlock. Anything else that streams the CAMSS IR video nodes holds the media
# links the bridge needs, and the bridge then fails with "enable link ...:
# Device or resource busy". libcamera-sl7 0.7.2-4.3 and later no longer
# register the sensor at all; these rules are the second line of defence.
#
# libcamera: do not create a device for the VD55G0 (device.product.name is the
# sensor model, api.libcamera.path the firmware node of the sensor at I2C
# address 0x10). This keeps the camera out of the portal and the browsers, but
# it cannot stop libcamera itself from enumerating the sensor when the
# libcamera package is not libcamera-sl7.
monitor.libcamera.rules = [
  {
    matches = [
      {
        device.product.name = "~vd55g*"
      }
      {
        api.libcamera.path = "~*camera@10"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

# V4L2: the CAMSS video nodes are raw Bayer or Y8 capture nodes (the RGB
# webcam reaches applications through libcamera), and the loopback node is the
# bridge's output. A browser that opened the loopback through PipeWire would
# start a bridge session (the IR emitter would flash) and, because the
# loopback has a single capture client, make howdy fail with EBUSY. howdy opens
# /dev/v4l/by-id/sl7-ir-camera directly, which these rules do not affect.
monitor.v4l2.rules = [
  {
    matches = [
      {
        api.v4l2.cap.driver = "qcom-camss"
      }
      {
        api.v4l2.cap.card = "SL7 IR Camera"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
