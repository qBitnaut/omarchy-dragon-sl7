# Opt-in USB runtime power management (sl7-usb-rpm, README section 8h).
#
# Controllers listed in USB_RPM_TESTED_OK get power/control=auto at boot from
# /usr/lib/udev/rules.d/80-omarchy-sl7-usb-rpm.rules. The shipped list is empty,
# so nothing changes until you add a controller. Do not edit by hand while
# testing: use `sudo sl7-usb-rpm enable <controller> --record` after you tested
# it, and `sudo sl7-usb-rpm disable <controller> --forget` to roll back.
#
# Known controllers: a400000.usb (USB-A, behind the PTN3222 repeater),
# a600000.usb and a800000.usb (the two USB-C ports).
#
# WARNING: a Latitude 7455 (same SoC family) shut down with all four of its
# controllers enabled and was fine with three. Add them one at a time.
USB_RPM_TESTED_OK=""

# Autosuspend delay written to power/autosuspend_delay_ms of the controller and
# its xHCI device, in milliseconds.
USB_RPM_DELAY_MS=2000
