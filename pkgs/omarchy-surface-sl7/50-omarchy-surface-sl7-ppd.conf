# Omarchy 4.5's omarchy-power-profiles-daemon ships a cpufreq driver that caps
# scaling_max_freq (60% power-saver, 75% balanced) and re-applies it on resume.
# omarchy-sl7-powermode owns the CPU caps on this machine (its own levels, per
# power source), so block that driver: one writer, no tug of war.
# The empty ExecStart= clears the packaged command line first.
[Service]
ExecStart=
ExecStart=/usr/lib/power-profiles-daemon --block-driver=cpufreq
