# Clean power-off before the battery reaches the brownout region.
# Installed as /etc/UPower/UPower.conf.d/50-sl7-low-battery.conf; overrides the
# values in /etc/UPower/UPower.conf. UsePercentageForPolicy already defaults to
# true, so the percentages below are the ones UPower uses. The values must stay
# in descending order (Low > Critical > Action) or UPower falls back to defaults.
# Without this, CriticalPowerAction=Auto requested a plain suspend at 0% and the
# machine looped suspend/wake until it browned out. There is no RTC wake alarm on
# the SL7, so power off is the only safe critical action (hibernate is untested).
[UPower]
PercentageLow=20.0
PercentageCritical=8.0
PercentageAction=5.0
CriticalPowerAction=PowerOff
