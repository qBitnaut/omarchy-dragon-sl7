# Surface Laptop 7: kernel command line and UKI policy for limine-entry-tool.
# Installed by omarchy-surface-sl7.
#
# Omarchy's own drop-ins keep supplying quiet boot (omarchy-defaults.conf) and
# "clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.tpm2_wait=0"
# (qualcomm-snapdragon.conf). Only the SL7 additions live here.
#
# schedutil: the default governor on this kernel is not what the cpufreq
# measurements were taken with. fw_devlink.sync_state=timeout: lets unused
# providers (CDSP etc.) enter their low-power state; about 1.10 W -> 0.90 W
# in suspend on the Dell 7441 (same SoC family). console=tty0 keeps Plymouth
# and the unlock prompt on the laptop screen.
KERNEL_CMDLINE[default]+=" cpufreq.default_governor=schedutil fw_devlink.sync_state=timeout console=tty0"

# Variable refresh rate (linux-sl7 patch 0024): panel 24-120 Hz instead of a
# fixed 120 Hz. On by default. To turn it off delete the next line, run
# "sudo limine-mkinitcpio" and reboot.
KERNEL_CMDLINE[default]+=" msm.vrr_enabled=1"

# A bare "protocol: linux" entry carries no device tree and the machine resets
# at boot, so the UKI (which embeds the DTBs, see update-uki-dtbs) is mandatory.
ENABLE_UKI=yes
