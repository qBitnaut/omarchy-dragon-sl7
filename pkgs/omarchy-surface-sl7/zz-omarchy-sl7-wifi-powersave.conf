# Wi-Fi power save on, for the Surface Laptop 7 (omarchy-surface-sl7).
#
# Omarchy ships /etc/NetworkManager/conf.d/omarchy-wifi-powersave.conf with
# wifi.powersave = 2 (disable) and NetworkManager applies that on every
# (re)association, which undoes "iw set power_save on". NetworkManager reads
# conf.d files from all directories sorted by file name, later files win, so
# this name has to sort after "omarchy-wifi-powersave.conf": hence the zz-.
# 3 = enable (0 default, 1 ignore, 2 disable).
#
# The NetworkManager dispatcher script 90-omarchy-sl7-wifi-powersave runs right
# after the connection is up and switches power save off again while on AC
# (power.conf WIFI_PS=yes). Trade-off: a sleeping radio adds latency (tens of
# milliseconds on the first packet after idle). To opt out, mask this file:
#   sudo ln -sf /dev/null /etc/NetworkManager/conf.d/zz-omarchy-sl7-wifi-powersave.conf
[connection]
wifi.powersave = 3
