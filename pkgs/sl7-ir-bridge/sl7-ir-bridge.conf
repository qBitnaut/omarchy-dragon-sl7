# sl7-ir-bridge settings, read by sl7-ir-bridge.service (EnvironmentFile).
# Restart the service after a change: systemctl restart sl7-ir-bridge

# IR emitter control. "on" (default): every camera session sets Windows' sensor
# settings (manual exposure 100 lines, frame length 1750 lines) and lights the
# IR emitter with the sensor's strobe (led_mode=flash), and switches it off
# when the session ends. "off": the emitter stays dark. The kernel holds the
# strobe to Windows' timing either way. See the README.
IR_EMITTER=on

# Gain (control values). Analog gain 24 (sensor power-on value 19, max 28)
# gives face unlock a brighter frame and a faster match; gain does not change
# how long the emitter is lit. Comment it out for the driver's power-on value.
# Exposure and frame length are not settable.
IR_GAIN_ANALOG=24
#IR_GAIN_DIGITAL=256

# Keep streaming this long (ms) after the consumer stops, so quick reopens do
# not power-cycle the sensor. Range 0-5000.
#IR_STOP_GRACE_MS=500

# Per-session streaming cap (ms), at most 10000. After it the bridge stops the
# CAMSS stream and waits for a fresh consumer start.
#IR_SESSION_MAX_MS=10000

# CAMSS route of the IR camera: msm_csiphy0 -> CSID -> VFE RDI0 -> video node.
# libcamera wires the RGB camera through the first route (msm_csid0 and
# msm_vfe0_rdi0) and holds it while the desktop session runs, so the IR camera
# defaults to msm_csid2 and msm_vfe2_rdi0 (/dev/video10 today, found by name).
# A full entity name or just the number is accepted. If the route is taken by
# another camera, the bridge uses the next free CSID/VFE on its own.
#IR_CSID=msm_csid2
#IR_VFE_RDI=msm_vfe2_rdi0
