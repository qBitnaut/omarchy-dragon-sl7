# sl7-ir-bridge settings, read by sl7-ir-bridge.service (EnvironmentFile).
# Restart the service after a change: systemctl restart sl7-ir-bridge

# IR emitter control. "on" (default): every camera session sets Windows' sensor
# settings (manual exposure 100 lines, frame length 1750 lines) and lights the
# IR emitter with the sensor's strobe (led_mode=flash), and switches it off
# when the session ends. "off": the emitter stays dark. The kernel holds the
# strobe to Windows' timing either way. See the README.
IR_EMITTER=on

# Optional gain overrides (control values; default: the driver's, which are the
# sensor's power-on values, as Windows' init leaves them). Exposure and frame
# length are not settable.
#IR_GAIN_ANALOG=19
#IR_GAIN_DIGITAL=256

# Keep streaming this long (ms) after the consumer stops, so quick reopens do
# not power-cycle the sensor. Range 0-5000.
#IR_STOP_GRACE_MS=500

# Per-session streaming cap (ms), at most 10000. After it the bridge stops the
# CAMSS stream and waits for a fresh consumer start.
#IR_SESSION_MAX_MS=10000
