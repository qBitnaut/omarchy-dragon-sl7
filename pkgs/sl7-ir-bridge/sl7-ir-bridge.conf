# sl7-ir-bridge settings, read by sl7-ir-bridge.service (EnvironmentFile).
# Restart the service after a change: systemctl restart sl7-ir-bridge

# IR emitter control. Must stay "off": this package version has no emitter
# support built in, "on" is ignored with a warning. See the README.
IR_EMITTER=off

# Keep streaming this long (ms) after the consumer stops, so quick reopens do
# not power-cycle the sensor. Range 0-5000.
#IR_STOP_GRACE_MS=500

# Per-session streaming cap (ms), at most 10000. After it the bridge stops the
# CAMSS stream and waits for a fresh consumer start.
#IR_SESSION_MAX_MS=10000
