# One loopback node for the IR bridge. video_nr=42 stays clear of the CAMSS
# video0-15 nodes. exclusive_caps=1 makes the node show only CAPTURE caps
# (needed by OpenCV and browsers). Override in /etc/modprobe.d/ if needed.
options v4l2loopback devices=1 video_nr=42 card_label="SL7 IR Camera" exclusive_caps=1 max_buffers=4
